[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hockeycore"
version = "2.0.0a1"
description = "HOCKEYPROJECTS v2 — league-agnostic live hockey betting models"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["hockeycore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
